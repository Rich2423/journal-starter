name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]

env:
  ACR_NAME: journalapiacr2
  IMAGE_NAME: journal-api
  RESOURCE_GROUP: rg-journal-api
  CONTAINER_APP_NAME: journal-api
  CONTAINER_APP_ENV: journal-api-env

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS1 }}

      - name: Build and push image via ACR Tasks
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            --platform linux/amd64 \
            .

      - name: Deploy to Container Apps
        run: |
          az extension add --name containerapp --upgrade
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
